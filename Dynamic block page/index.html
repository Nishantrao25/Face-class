<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Blog Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>My Dynamic Blog</h1>
        <p>Welcome to my blog! Here you'll find the latest posts and updates.</p>
    </header>

    <main class="main-content">
        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search posts...">
            <button id="reloadButton" type="button">Reload Posts</button>
        </section>

        <p id="status-message" role="status" aria-live="polite">Loading posts...</p>

        <section id="postsContainer" class="posts-container"></section>
    </main>
</body>
</html>
